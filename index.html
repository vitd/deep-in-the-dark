<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%230b3644%22/><rect x=%223%22 y=%227%22 width=%2210%22 height=%224%22 fill=%22%238c4a3c%22/><rect x=%225%22 y=%224%22 width=%224%22 height=%223%22 fill=%22%23c8c0b0%22/></svg>" />
    <title>Deep in the Dark</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="underwater" class="hidden"></div>

    <div id="ui">
      <!-- Intro -->
      <div id="intro" class="overlay hidden">
        <video id="intro-video" playsinline muted></video>
        <div id="intro-hint">Leertaste / Esc / Klick: Überspringen</div>
      </div>

      <!-- Hauptmenü -->
      <div id="menu" class="overlay hidden">
        <h1 class="title">DEEP IN THE DARK</h1>
        <div class="menu-buttons">
          <button id="btn-new">Neues Spiel</button>
          <button id="btn-load">Spiel laden</button>
          <button id="btn-options">Optionen</button>
          <button id="btn-quit">Beenden</button>
        </div>
        <div class="menu-footer">v0.2 – Milestone 2</div>
      </div>

      <!-- Optionen -->
      <div id="options" class="overlay hidden">
        <h2>Optionen</h2>
        <div class="option-row">
          <label for="opt-volume">Lautstärke</label>
          <input id="opt-volume" type="range" min="0" max="1" step="0.05" />
        </div>
        <div class="option-row">
          <label for="opt-sensitivity">Maus-Empfindlichkeit</label>
          <input id="opt-sensitivity" type="range" min="0.2" max="3" step="0.1" />
        </div>
        <div class="menu-buttons">
          <button id="btn-options-back">Zurück</button>
        </div>
      </div>

      <!-- Pause -->
      <div id="pause" class="overlay hidden">
        <h2>Pause</h2>
        <div class="menu-buttons">
          <button id="btn-resume">Fortsetzen</button>
          <button id="btn-pause-options">Optionen</button>
          <button id="btn-to-menu">Zum Hauptmenü</button>
        </div>
      </div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="prompt" class="hidden"></div>
        <div id="lowair"></div>
        <div id="drown-timer" class="hidden"></div>
        <div id="warn-tauchauf" class="hidden">TAUCH AUF!</div>
        <!-- Touch-Steuerung (nur auf Touch-Geräten sichtbar) -->
        <div id="touch-ui" class="hidden">
          <div id="look-area"></div>
          <div id="joystick"><div id="joystick-knob"></div></div>
          <div id="btn-touch-action" class="touch-btn">E</div>
          <div id="btn-touch-jump" class="touch-btn">▲</div>
          <div id="btn-touch-inv" class="touch-btn small">INV</div>
          <div id="btn-touch-pause" class="touch-btn small">❚❚</div>
        </div>
        <div id="stats">
          <div class="stat-row">
            <span class="stat-label">Nahrung</span>
            <div class="stat-track"><div id="bar-nahrung" class="stat-fill nahrung"></div></div>
          </div>
          <div class="stat-row">
            <span class="stat-label">Luft</span>
            <div class="stat-track"><div id="bar-luft" class="stat-fill luft"></div></div>
          </div>
        </div>
      </div>

      <!-- Inventar -->
      <div id="inventory" class="overlay hidden">
        <h2>Inventar</h2>
        <div id="inventory-grid"></div>
        <div class="inv-hint">Fisch anklicken zum Essen · Tab: Schließen</div>
        <div class="menu-buttons">
          <button id="btn-inv-close">Schließen</button>
        </div>
      </div>

      <!-- Tod -->
      <div id="death" class="overlay hidden">
        <h2 class="death-title">DU BIST ERTRUNKEN</h2>
        <div class="menu-buttons">
          <button id="btn-death-retry">Neuer Versuch</button>
          <button id="btn-death-menu">Zum Hauptmenü</button>
        </div>
      </div>

      <div id="toast" class="hidden"></div>
      <div id="debug" class="hidden"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
