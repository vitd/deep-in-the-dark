<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%230b3644%22/><rect x=%223%22 y=%227%22 width=%2210%22 height=%224%22 fill=%22%238c4a3c%22/><rect x=%225%22 y=%224%22 width=%224%22 height=%223%22 fill=%22%23c8c0b0%22/></svg>" />
    <title>Deep in the Dark</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="underwater" class="hidden"></div>

    <div id="ui">
      <!-- Intro -->
      <div id="intro" class="overlay hidden">
        <video id="intro-video" playsinline muted></video>
        <div id="intro-hint">Leertaste / Esc / Klick: Überspringen</div>
      </div>

      <!-- Hauptmenü -->
      <div id="menu" class="overlay hidden">
        <h1 class="title">DEEP IN THE DARK</h1>
        <div class="menu-buttons">
          <button id="btn-new">Neues Spiel</button>
          <button id="btn-load">Spiel laden</button>
          <button id="btn-options">Optionen</button>
          <button id="btn-quit">Beenden</button>
        </div>
        <div class="menu-footer">v0.1 – Milestone 1</div>
      </div>

      <!-- Optionen -->
      <div id="options" class="overlay hidden">
        <h2>Optionen</h2>
        <div class="option-row">
          <label for="opt-volume">Lautstärke</label>
          <input id="opt-volume" type="range" min="0" max="1" step="0.05" />
        </div>
        <div class="option-row">
          <label for="opt-sensitivity">Maus-Empfindlichkeit</label>
          <input id="opt-sensitivity" type="range" min="0.2" max="3" step="0.1" />
        </div>
        <div class="menu-buttons">
          <button id="btn-options-back">Zurück</button>
        </div>
      </div>

      <!-- Pause -->
      <div id="pause" class="overlay hidden">
        <h2>Pause</h2>
        <div class="menu-buttons">
          <button id="btn-resume">Fortsetzen</button>
          <button id="btn-pause-options">Optionen</button>
          <button id="btn-to-menu">Zum Hauptmenü</button>
        </div>
      </div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="prompt" class="hidden"></div>
      </div>

      <!-- Inventar -->
      <div id="inventory" class="overlay hidden">
        <h2>Inventar</h2>
        <div id="inventory-grid"></div>
        <div class="inv-hint">Tab: Schließen</div>
      </div>

      <div id="toast" class="hidden"></div>
      <div id="debug" class="hidden"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
